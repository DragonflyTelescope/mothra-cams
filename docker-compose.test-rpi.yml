# Test configuration for ASI676MC color camera on Raspberry Pi (ARM64)
services:
  observatory-camera:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        ARCH: armv8  # Use ARM64 libraries
    container_name: asi676mc-test-rpi
    volumes:
      - /home/pi/asi_testimages:/tmp  # Mount Pi directory for test images
      - /dev/bus/usb:/dev/bus/usb
    devices:
      - /dev/bus/usb
    privileged: true  # Required for USB access
    env_file:
      - .env
    restart: "no"  # Don't restart automatically for testing
    environment:
      - TZ=America/Santiago
      # ASI676MC color camera test configuration
      - CAMERA_ID=0
      - CAMERA_NAME=test-asi676mc-rpi
      - CAMERA_TYPE=color  # ASI676MC is a color camera
      - SKIP_S3_UPLOAD=true  # Skip S3 for testing - files saved to /tmp/
      - DEBUG_MODE=true  # Enable debug mode - no continuous capture
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"