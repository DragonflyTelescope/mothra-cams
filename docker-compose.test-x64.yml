# Test configuration for ASI676MC color camera on x64 Linux
services:
  observatory-camera:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        ARCH: x64  # Use x64 libraries
    container_name: asi676mc-test-x64
    volumes:
      - ./test_images:/tmp  # Mount local directory for test images
      - /dev/bus/usb:/dev/bus/usb
    devices:
      - /dev/bus/usb
    privileged: true  # May be needed for USB access
    env_file:
      - .env
    restart: "no"  # Don't restart automatically for testing
    environment:
      - TZ=America/Santiago
      # ASI676MC color camera test configuration
      - CAMERA_ID=0
      - CAMERA_NAME=test-asi676mc-x64
      - CAMERA_TYPE=color  # ASI676MC is a color camera
      - SKIP_S3_UPLOAD=true  # Skip S3 for testing - files saved to /tmp/
      - DEBUG_MODE=true  # Enable debug mode - no continuous capture
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"