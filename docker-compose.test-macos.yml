# Test configuration for ASI676MC color camera on macOS
# Optimized for macOS USB device access
services:
  observatory-camera:
    build: .
    container_name: asi676mc-test-macos
    volumes:
      - /Users/ipasha/Documents:/tmp  # Mount host Documents to container /tmp
    # macOS USB device access approach
    privileged: true  # Required for USB access on macOS with Docker Desktop
    # Alternative: use specific device access if available
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0  # If ZWO camera appears as ttyUSB device
    env_file:
      - .env
    restart: "no"  # Don't restart automatically for testing
    environment:
      - TZ=America/Santiago
      # ASI676MC color camera test configuration
      - CAMERA_ID=0
      - CAMERA_NAME=test-asi676mc-macos
      - CAMERA_TYPE=color  # ASI676MC is a color camera
      - SKIP_S3_UPLOAD=true  # Skip S3 for testing - files saved to /tmp/
      - DEBUG_MODE=true  # Enable debug mode - no continuous capture
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"