services:
  observatory-camera:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        ARCH: ${ARCH:-x64}  # Default to x64, override with ARCH environment variable
    container_name: observatory-camera
    user: "1000:1000"
    volumes:
      - /home/mothra/git/mothra-cams:/repo
      - /dev/bus/usb:/dev/bus/usb
      - /mnt/environment/:/mnt/environment/
      - /home/mothra:/home/mothra/
    devices:
      - /dev/bus/usb
    #privileged: true
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - TZ=America/Santiago
      # Camera configuration - customize these for each deployment
      - CAMERA_ID=0
      - CAMERA_NAME=b14m11
      - CAMERA_TYPE=mono  # "mono" or "color"
      - SKIP_S3_UPLOAD=false  # Set to "true" for local testing
      - DEBUG_MODE=false  # Set to "true" to disable continuous capture (for manual testing)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
